# One field for the code the game's bug report window gives (/sgf bug), so a player needs to
# know nothing about GitHub but signing in, pasting and sending (SmartBlessingBar's ruleset plan
# 2026-10-24-bug-report). GitHub reads issue forms from the default branch only.
name: Bug report
description: Something in SmartGroupFilter does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public, under your GitHub name.** Everyone can read what you send here.

        In the game, type `/sgf bug`, write what happened, choose where it happened, and
        copy the code with Ctrl+C. "Show content" in the window shows everything the code
        holds: the addon's version, settings and level range, your client's version, build and
        language, your class and level band, your listing's activity IDs, the list's counts,
        the Build Group button's state, how many members answered Blizzard's role check,
        invited players as role, class and level, group size,
        combat and panel state, the area you chose, this addon's Lua errors with stack and
        local values, its last actions, and what you type. It is filtered for your character,
        realm and guild, the names of your group, every name the Group Finder showed this
        session, the players SmartGroupFilter invited, GUIDs, BattleTags, e-mail addresses and
        absolute file paths - friends, guild members or a name written together with other
        letters can remain, so check "Show content". The code is not encrypted: anyone can
        read it.
        See [privacy](https://github.com/ZulshiBLN/SmartGroupFilter#privacy-and-security)
        and [data protection](https://github.com/ZulshiBLN/SmartGroupFilter#data-protection).

        On an older version of the addon, without a code? Update first. If you cannot, open a
        blank issue and remove the "Date:" line and any names from the old report before you
        send it.
  - type: textarea
    id: code
    attributes:
      label: Report code
      description: Paste the code from the game here. It starts with "SGF1:".
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public acknowledgement
      options:
        - label: I looked at the content ("Show content" in the game) and agree that it is public.
          required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Screenshots are public too - crop or blur names, chat, realm, guild and anything personal before you add one.
